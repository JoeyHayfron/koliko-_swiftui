<svg xmlns="http://www.w3.org/2000/svg" width="280" height="260" viewBox="0 0 280 260">
  <defs>
    <linearGradient id="gPoster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2B2E"></stop><stop offset="1" stop-color="#3F5D5A"></stop>
    </linearGradient>
    <linearGradient id="vig2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.55"></stop>
    </linearGradient>
    <pattern id="stripe2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#fff" stroke-width="1"></line>
    </pattern>
    <filter id="devShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0A1622" flood-opacity="0.28"></feDropShadow>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0A1622" flood-opacity="0.16"></feDropShadow>
    </filter>
    <clipPath id="clipPoster"><rect width="144" height="214" rx="16"></rect></clipPath>
  </defs>

  
  <g transform="translate(60,18)" filter="url(#devShadow)">
    <rect width="160" height="230" rx="24" fill="#0A1622"></rect>
    <g transform="translate(8,8)">
      <g clip-path="url(#clipPoster)">
        <rect width="144" height="214" fill="url(#gPoster)"></rect>
        <rect width="144" height="214" fill="url(#stripe2)" opacity="0.08"></rect>
        <rect width="144" height="214" fill="url(#vig2)"></rect>
        <text x="12" y="196" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Walking by Faith</text>
        
        <g transform="translate(8,172)">
          <rect width="128" height="28" rx="10" fill="#0A1622" fill-opacity="0.78"></rect>
          <circle cx="22" cy="14" r="8" fill="#1F8A5B"></circle>
          <g transform="translate(14,6) scale(0.5)"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></g>
          <text x="36" y="19" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Downloaded</text>
        </g>
      </g>
    </g>
  </g>

  
  <g filter="url(#chipShadow)">
    <circle cx="140" cy="18" r="24" fill="#fff"></circle>
    <g transform="translate(140,18) scale(0.92) translate(-12,-12)">
      <path d="M12 4v12M6 10l6 6 6-6M4 20h16" fill="none" stroke="#00AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  
  <g transform="translate(6,208) rotate(-6 75 17)" filter="url(#chipShadow)">
    <rect width="156" height="34" rx="17" fill="#fff"></rect>
    <g transform="translate(14,8)">
      <path d="M2 9a14 14 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8 15a6 6 0 0 1 8 0" fill="none" stroke="#7C8B98" stroke-width="1.8" stroke-linecap="round"></path>
      <circle cx="12" cy="19" r="1.3" fill="#7C8B98"></circle>
      <line x1="2" y1="20" x2="22" y2="3" stroke="#C2412B" stroke-width="2" stroke-linecap="round"></line>
    </g>
    <text x="44" y="22" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#3B5161">Airplane mode</text>
  </g>

  
  <g transform="translate(150,226) rotate(5 58 16)" filter="url(#chipShadow)">
    <rect width="116" height="32" rx="16" fill="#0E1B26"></rect>
    <g transform="translate(14,10) scale(0.6)"><polygon points="6,4 20,12 6,20" fill="#00AAFF"></polygon></g>
    <text x="34" y="21" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Now playing</text>
  </g>
</svg>