<svg xmlns="http://www.w3.org/2000/svg" width="280" height="260" viewBox="0 0 280 260">
  <defs>
    <linearGradient id="gBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2218"></stop><stop offset="1" stop-color="#5C4128"></stop>
    </linearGradient>
    <linearGradient id="gSquare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D2718"></stop><stop offset="1" stop-color="#6B3F22"></stop>
    </linearGradient>
    <linearGradient id="gVideo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2A3D"></stop><stop offset="1" stop-color="#2E5577"></stop>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.55"></stop>
    </linearGradient>
    <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#fff" stroke-width="1"></line>
    </pattern>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#0A1622" flood-opacity="0.22"></feDropShadow>
    </filter>
    <filter id="bubbleShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00AAFF" flood-opacity="0.45"></feDropShadow>
    </filter>
    <clipPath id="clipBook"><rect width="110" height="158" rx="16"></rect></clipPath>
    <clipPath id="clipSquare"><rect width="116" height="116" rx="16"></rect></clipPath>
    <clipPath id="clipVideo"><rect width="138" height="196" rx="16"></rect></clipPath>
  </defs>

  
  <g transform="translate(8,30) rotate(-12 55 79)" filter="url(#cardShadow)">
    <g clip-path="url(#clipBook)">
      <rect width="110" height="158" fill="url(#gBook)"></rect>
      <rect width="110" height="158" fill="url(#stripe)" opacity="0.08"></rect>
      <rect width="110" height="158" fill="url(#vig)"></rect>
      <text x="10" y="148" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Hope · 60 days</text>
    </g>
  </g>

  
  <g transform="translate(156,52) rotate(9 58 58)" filter="url(#cardShadow)">
    <g clip-path="url(#clipSquare)">
      <rect width="116" height="116" fill="url(#gSquare)"></rect>
      <rect width="116" height="116" fill="url(#stripe)" opacity="0.08"></rect>
      <rect width="116" height="116" fill="url(#vig)"></rect>
      <text x="10" y="106" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Family Worship</text>
    </g>
  </g>

  
  <g transform="translate(71,36) rotate(-2 69 98)" filter="url(#cardShadow)">
    <g clip-path="url(#clipVideo)">
      <rect width="138" height="196" fill="url(#gVideo)"></rect>
      <rect width="138" height="196" fill="url(#stripe)" opacity="0.08"></rect>
      <rect width="138" height="196" fill="url(#vig)"></rect>
      <text x="12" y="170" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">The Chosen</text>
      
      <g transform="translate(12,178) scale(0.5)">
        <path d="M12 3l2.7 5.5 6 .9-4.4 4.3 1 6L12 17l-5.3 2.7 1-6L3.3 9.4l6-.9L12 3z" fill="#00AAFF"></path>
      </g>
      <text x="26" y="189" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="500" fill="#fff" opacity="0.92">4.9</text>
    </g>
    
    <circle cx="69" cy="98" r="22" fill="#fff" fill-opacity="0.92"></circle>
    <path d="M64 88 L82 98 L64 108 Z" fill="#0E1B26"></path>
  </g>

  
  <g transform="translate(218,0)" filter="url(#bubbleShadow)">
    <circle cx="22" cy="22" r="22" fill="#00AAFF"></circle>
    <g transform="translate(22,22) scale(0.85) translate(-12,-12)">
      <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#fff"></path>
    </g>
  </g>
</svg>